    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Font Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Pacifico&family=Great+Vibes&family=Satisfy&family=Parisienne&family=Playball&family=Tangerine:wght@400;700&family=Allura&family=Alex+Brush&display=swap');
        
        .font-1 { font-family: 'Dancing Script', cursive; }
        .font-2 { font-family: 'Pacifico', cursive; }
        .font-3 { font-family: 'Great Vibes', cursive; }
        .font-4 { font-family: 'Satisfy', cursive; }
        .font-5 { font-family: 'Parisienne', cursive; }
        .font-6 { font-family: 'Playball', cursive; }
        .font-7 { font-family: 'Tangerine', cursive; }
        .font-8 { font-family: 'Allura', cursive; }
        .font-9 { font-family: 'Alex Brush', cursive; }
        
        .gradient-text {
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Pacifico&family=Great+Vibes&family=Satisfy&family=Parisienne&family=Playball&family=Tangerine:wght@400;700&family=Allura&family=Alex+Brush&display=swap');
        
        .font-1 { font-family: 'Dancing Script', cursive; }
        .font-2 { font-family: 'Pacifico', cursive; }
        .font-3 { font-family: 'Great Vibes', cursive; }
        .font-4 { font-family: 'Satisfy', cursive; }
        .font-5 { font-family: 'Parisienne', cursive; }
        .font-6 { font-family: 'Playball', cursive; }
        .font-7 { font-family: 'Tangerine', cursive; }
        .font-8 { font-family: 'Allura', cursive; }
        .font-9 { font-family: 'Alex Brush', cursive; }
        
        .gradient-text {
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .text-shadow {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .text-outline {
            -webkit-text-stroke: 1px #fff;
            color: transparent;
        }
        
        .preview-container {
            transition: all 0.3s ease;
            min-height: 200px;
        }
        
        @media (max-width: 640px) {
            .font-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-pink-600 mb-2">Beautiful Font Generator</h1>
            <p class="text-gray-600 text-lg">Transform your text into stunning designs and save as images</p>
        </header>
        
        <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="mb-6">
                <label for="inputText" class="block text-gray-700 font-medium mb-2">Enter your text:</label>
                <textarea id="inputText" rows="3" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-transparent" placeholder="Type something beautiful...">Your Beautiful Text</textarea>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">Font Style:</label>
                <div class="font-options grid grid-cols-3 md:grid-cols-5 gap-3 mb-4">
                    <button onclick="applyFont('font-1')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition font-1">Dancing Script</button>
                    <button onclick="applyFont('font-2')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition font-2">Pacifico</button>
                    <button onclick="applyFont('font-3')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition font-3">Great Vibes</button>
                    <button onclick="applyFont('font-4')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition font-4">Satisfy</button>
                    <button onclick="applyFont('font-5')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition font-5">Parisienne</button>
                    <button onclick="applyFont('font-6')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition font-6">Playball</button>
                    <button onclick="applyFont('font-7')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition font-7">Tangerine</button>
                    <button onclick="applyFont('font-8')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition font-8">Allura</button>
                    <button onclick="applyFont('font-9')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition font-9">Alex Brush</button>
                </div>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">Text Effects:</label>
                <div class="flex flex-wrap gap-3">
                    <button onclick="toggleEffect('gradient-text')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition">Gradient</button>
                    <button onclick="toggleEffect('text-shadow')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition">Shadow</button>
                    <button onclick="toggleEffect('text-outline')" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition">Outline</button>
                    <button onclick="changeTextColor()" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition">Color</button>
                    <button onclick="changeFontSize()" class="px-3 py-2 rounded-lg border border-gray-200 hover:bg-pink-50 transition">Size</button>
                </div>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">Background:</label>
                <div class="flex flex-wrap gap-3">
                    <button onclick="changeBg('bg-white')" class="w-8 h-8 rounded-full bg-white border border-gray-300"></button>
                    <button onclick="changeBg('bg-pink-50')" class="w-8 h-8 rounded-full bg-pink-50 border border-gray-300"></button>
                    <button onclick="changeBg('bg-gradient-to-r from-pink-500 to-purple-500')" class="w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 border border-gray-300"></button>
                    <button onclick="changeBg('bg-gradient-to-r from-yellow-400 to-pink-500')" class="w-8 h-8 rounded-full bg-gradient-to-r from-yellow-400 to-pink-500 border border-gray-300"></button>
                    <button onclick="changeBg('bg-gradient-to-r from-green-400 to-blue-500')" class="w-8 h-8 rounded-full bg-gradient-to-r from-green-400 to-blue-500 border border-gray-300"></button>
                    <button onclick="changeBg('bg-black')" class="w-8 h-8 rounded-full bg-black border border-gray-300"></button>
                </div>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-800">Preview</h2>
                <div class="flex gap-2">
                    <button onclick="saveAsImage()" class="px-4 py-2 bg-pink-600 text-white rounded-lg hover:bg-pink-700 transition flex items-center gap-2">
                        <i class="fas fa-download"></i> Save Image
                    </button>
                    <button onclick="copyToClipboard()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition flex items-center gap-2">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
            </div>
            
            <div id="preview" class="preview-container w-full flex items-center justify-center p-8 rounded-lg bg-white border-2 border-dashed border-gray-200">
                <p id="textDisplay" class="text-4xl text-center text-pink-600 font-1">Your Beautiful Text</p>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Recent Designs</h2>
            <div id="savedDesigns" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Saved designs will appear here -->
            </div>
        </div>
    </div>

    <script>
        let currentFont = 'font-1';
        let currentEffects = [];
        let currentBg = 'bg-white';
        let currentColor = 'text-pink-600';
        let currentSize = 'text-4xl';
        
        document.getElementById('inputText').addEventListener('input', function() {
            updateText();
        });
        
        function updateText() {
            const text = document.getElementById('inputText').value;
            const display = document.getElementById('textDisplay');
            display.textContent = text || 'Your Beautiful Text';
            
            // Apply all current styles
            display.className = `${currentSize} text-center ${currentColor} ${currentFont} ${currentEffects.join(' ')}`;
            
            // Update background
            const preview = document.getElementById('preview');
            preview.className = `preview-container w-full flex items-center justify-center p-8 rounded-lg ${currentBg} border-2 border-dashed border-gray-200`;
        }
        
        function applyFont(fontClass) {
            currentFont = fontClass;
            updateText();
        }
        
        function toggleEffect(effectClass) {
            const index = currentEffects.indexOf(effectClass);
            if (index === -1) {
                currentEffects.push(effectClass);
            } else {
                currentEffects.splice(index, 1);
            }
            updateText();
        }
        
        function changeBg(bgClass) {
            currentBg = bgClass;
            updateText();
        }
        
        function changeTextColor() {
            const colors = [
                'text-pink-600', 'text-purple-600', 'text-blue-600', 
                'text-green-600', 'text-yellow-600', 'text-red-600',
                'text-black', 'text-white', 'text-gray-600'
            ];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            currentColor = randomColor;
            updateText();
        }
        
        function changeFontSize() {
            const sizes = ['text-2xl', 'text-3xl', 'text-4xl', 'text-5xl', 'text-6xl', 'text-7xl'];
            const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
            currentSize = randomSize;
            updateText();
        }
        
        function saveAsImage() {
            const preview = document.getElementById('preview');
            
            html2canvas(preview, {
                backgroundColor: null,
                scale: 2 // Higher quality
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'beautiful-text.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Save to recent designs
                saveToRecentDesigns(canvas.toDataURL('image/png'));
            });
        }
        
        function copyToClipboard() {
            const preview = document.getElementById('preview');
            
            html2canvas(preview, {
                backgroundColor: null,
                scale: 2
            }).then(canvas => {
                canvas.toBlob(blob => {
                    navigator.clipboard.write([
                        new ClipboardItem({
                            'image/png': blob
                        })
                    ]).then(() => {
                        alert('Copied to clipboard!');
                    }).catch(err => {
                        console.error('Could not copy to clipboard:', err);
                    });
                });
            });
        }
        
        function saveToRecentDesigns(imageData) {
            const savedDesigns = document.getElementById('savedDesigns');
            const designItem = document.createElement('div');
            designItem.className = 'rounded-lg overflow-hidden shadow-md cursor-pointer hover:shadow-lg transition';
            designItem.innerHTML = `
                <img src="${imageData}" alt="Saved design" class="w-full h-auto">
                <div class="p-2 bg-white text-center text-sm text-gray-600">Saved ${new Date().toLocaleTimeString()}</div>
            `;
            
            designItem.addEventListener('click', function() {
                // Set this design as current
                const img = this.querySelector('img');
                const preview = document.getElementById('preview');
                preview.style.backgroundImage = `url(${img.src})`;
                preview.style.backgroundSize = 'cover';
                preview.style.backgroundPosition = 'center';
            });
            
            savedDesigns.insertBefore(designItem, savedDesigns.firstChild);
            
            // Limit to 6 recent designs
            if (savedDesigns.children.length > 6) {
                savedDesigns.removeChild(savedDesigns.lastChild);
            }
        }
        
        // Initialize
        updateText();
    </script>
